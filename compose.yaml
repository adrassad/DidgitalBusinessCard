name: didgital-business-card

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: dbc
      POSTGRES_USER: dbc
      POSTGRES_PASSWORD: dbc
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbc -d dbc"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dbc_app:dbc_app@db:5432/dbc
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    external: true
    name: digital-business-card-db-data